
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diloo الفرجاني</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fa;color:#593e49;font-family:Tahoma,Arial,sans-serif}
header{background:#e9b6c6;text-align:center;padding:35px 15px}
h1{font-size:32px;margin:0}
header p{margin-bottom:0}
main{max-width:600px;margin:auto;padding:22px}
.welcome{background:white;padding:25px;border-radius:20px;text-align:center;box-shadow:0 3px 14px #e9b6c655}
h2{color:#aa6a80}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.tile{background:white;border:1px solid #efd2dc;border-radius:18px;padding:25px 10px;text-align:center}
.tile span{font-size:32px;display:block;margin-bottom:10px}
.tile b{display:block}
.tile small{color:#987b86}
footer{text-align:center;padding:25px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>✈️ Diloo الفرجاني</h1>
<p>خدمات الشحن والطلبات</p>
</header>
<main>
<section class="welcome">
<h2>أهلاً بك في Diloo</h2>
<p>كل شحناتك وطلباتك في مكان واحد</p>
</section>
<div class="grid">
<div class="tile"><span>📦</span><b>شحناتي</b><small>متابعة الشحنات</small></div>
<div class="tile"><span>📝</span><b>إنشاء شحنة</b><small>طلب شحن جديد</small></div>
<div class="tile"><span>🧮</span><b>الحاسبة</b><small>حساب تكلفة الشحن</small></div>
<div class="tile"><span>💳</span><b>المحفظة</b><small>الرصيد والعمليات</small></div>
<div class="tile"><span>👤</span><b>حسابي</b><small>البيانات الشخصية</small></div>
<div class="tile"><span>🔐</span><b>الإدارة</b><small>لوحة التحكم</small></div>
</div>
</main>
<footer>© 2026 Diloo الفرجاني</footer>
</body>
</html>
